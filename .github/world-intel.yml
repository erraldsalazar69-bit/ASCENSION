name: ASCENSION World Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect English headlines
        run: python scripts/fetch_news.py
      - name: Commit headlines if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ASCENSION World Intelligence headlines'
            git push
          fi
